name: Rerank pulled clips

# Mid North Coast. Re-ranks the clips an earlier "Pull and score" run already downloaded (its clips-<name>-bot*
# artifacts), with clap_index against a clue, leaving clips of actions already guessed wrong on air out of the A/B
# files (analysis/mnc/onair_guesses.json). No Freesound requests. Results replace results/<name>/clap_* on `results`.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name used by the pull (results/<name>/)"
        required: true
      run_id:
        description: "Run id of that Pull and score run"
        required: true
      clue:
        description: "Clue to rank against"
        default: clues/mnc/clue_stacked.wav
      ab:
        description: "How many A/B files"
        default: "20"

permissions:
  contents: write
  actions: read

jobs:
  rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clap-htsat-unfused
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-${{ inputs.name }}-bot*
          path: parts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Merge
        run: |
          mkdir -p "data/${{ inputs.name }}"
          python - <<'PY'
          import json, shutil, pathlib
          out = pathlib.Path("data/${{ inputs.name }}"); meta = {}
          for part in sorted(pathlib.Path("parts").iterdir()):
              m = part / "meta.json"
              if m.exists():
                  meta.update(json.loads(m.read_text(encoding="utf-8")))
              for f in part.glob("*.mp3"):
                  shutil.copy(f, out / f.name)
          (out / "meta.json").write_text(json.dumps(meta), encoding="utf-8")
          print(len(meta), "clips")
          PY
      - name: Rank, filter, A/B
        run: |
          out="results/${{ inputs.name }}"; mkdir -p "$out"
          python clap_index.py build "data/${{ inputs.name }}" --win 0.64 --max-events 6
          python clap_index.py query "${{ inputs.clue }}" "data/${{ inputs.name }}" --tag mnc --top 60 \
            --csv "$out/clap_scores.csv" --ab "${{ inputs.ab }}" --out "$out/ab_clap" \
            --skip-wrong analysis/mnc/onair_guesses.json | tee "$out/clap_scores.txt"
          echo "rerank of run ${{ inputs.run_id }}; clap_index.py, window 0.64 s; clue ${{ inputs.clue }}; on-air filter $(git rev-parse --short HEAD)" >> "$out/clap_scores.txt"
      - name: Commit to the results branch
        run: |
          git config user.name "secret-sound bot"
          git config user.email "actions@users.noreply.github.com"
          mv "results/${{ inputs.name }}" /tmp/res
          git fetch origin results
          git checkout -B results origin/results
          d="results/${{ inputs.name }}"; mkdir -p "$d"
          rm -rf "$d/ab_clap" "$d/clap_scores.csv" "$d/clap_scores.txt"
          cp -r /tmp/res/. "$d/"
          git add -f "$d"
          git commit -qm "results: ${{ inputs.name }} rerank" && git push -q origin results
