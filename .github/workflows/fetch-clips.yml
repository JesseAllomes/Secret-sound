name: Fetch clips

# Downloads the full Freesound preview (HQ mp3) of the given sound ids and commits them to results/clips/ on the
# `results` branch, so they can be listened to in full (this cloud session cannot reach Freesound). One API request per id.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Freesound ids, comma-separated, e.g. 27149,805328"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          K1: ${{ secrets.FREESOUND_KEY_SOUNDMAN }}
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p /tmp/clips
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          key = os.environ["K1"]
          for sid in re.findall(r"\d+", os.environ["IDS"]):
              with urllib.request.urlopen(f"https://freesound.org/apiv2/sounds/{sid}/?fields=id,name,previews,username,url&token={key}", timeout=60) as r:
                  d = json.load(r)
              name = re.sub(r"[^A-Za-z0-9]+", "-", d["name"].rsplit(".", 1)[0]).strip("-")[:50]
              urllib.request.urlretrieve(d["previews"]["preview-hq-mp3"], f"/tmp/clips/{sid}_{name}.mp3")
              print(sid, d["name"], d["url"])
              time.sleep(1.1)
          PY
      - name: Commit to the results branch
        run: |
          git config user.name "secret-sound bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin results
          git checkout -B results origin/results
          mkdir -p results/clips && cp /tmp/clips/*.mp3 results/clips/
          git add -f results/clips
          git commit -qm "clips: ${{ inputs.ids }}" && git push -q origin results
