name: Harvest MNC episodes

# Mid North Coast only. One runner per podcast episode (eps.json index): find plays, transcribe each segment, keep
# the play and segment audio. A final job merges everything into harvest_mnc/<name>/ on the `results` branch.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name (results/harvest_mnc/<name>/)"
        default: older
      first:
        description: "First episode index (eps.json order, 0 = newest)"
        required: true
      last:
        description: "Last episode index (inclusive)"
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      eps: ${{ steps.p.outputs.eps }}
    steps:
      - id: p
        run: echo "eps=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.first }}, ${{ inputs.last }}+1))))")" >> "$GITHUB_OUTPUT"

  episode:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.eps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-small-en
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy soundfile faster-whisper
      - name: Harvest episode ${{ matrix.n }}
        run: python harvest/mnc/harvest_one.py ${{ matrix.n }} --out out
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ matrix.n }}
          path: out
          retention-days: 7

  merge:
    needs: episode
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: harvest-*
          path: parts
          merge-multiple: true
      - name: Commit to the results branch
        run: |
          d="results/harvest_mnc/${{ inputs.name }}"
          mkdir -p /tmp/res && cp -r parts/. /tmp/res/
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/res")
          recs = sorted((json.loads(f.read_text()) for f in p.glob("rec_*.json")), key=lambda r: r["n"])
          (p / "harvest.jsonl").write_text("".join(json.dumps(r) + "\n" for r in recs))
          for r in recs:
              print(r["n"], r["date"][5:16], "plays", len(r["plays"]))
          PY
          git config user.name "secret-sound bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin results || true
          if git rev-parse --verify -q origin/results >/dev/null; then git checkout -B results origin/results; else git checkout --orphan results && git rm -rq --cached . && git clean -fdq; fi
          rm -rf "$d" && mkdir -p "$d" && cp -r /tmp/res/. "$d/"
          git add -f "$d"
          git commit -qm "results: harvest_mnc ${{ inputs.name }}" && git push -q origin results
