name: Pull and score

# Mid North Coast only. Runs a Freesound pull for one jobs/*.txt list, scores every clip with steel_score.py (whose
# fingerprint is calibrated on the Mid North Coast clue; not valid for Bendigo), builds A/B files
# for the best matches, and commits the results to the `results` branch (results/<name>/). The downloaded clips
# are kept as workflow artifacts. Needs the repository secret FREESOUND_KEY_SOUNDMAN; FREESOUND_KEY_SOUNDDETECTOR (optional) adds a second bot.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name, e.g. mnc_binding (results go to results/<name>/)"
        required: true
      queries:
        description: "Searches file, e.g. jobs/mnc_binding.txt"
        required: true
      ab_clue:
        description: "Clue used in the A/B files"
        default: clues/mnc/clue_v6b.wav
      per_query:
        description: "Results per search"
        default: "100"
      max_seconds:
        description: "Longest clip to pull (seconds)"
        default: "30"
      bots:
        description: "Bots to use (1 = SOUNDMAN key only; 2 also uses SOUNDDETECTOR)"
        default: "1"
      ab:
        description: "How many A/B files"
        default: "10"

permissions:
  contents: write

jobs:
  pull:
    # One bot per key: bot 1 uses FREESOUND_KEY_SOUNDMAN; bot 2 runs only if FREESOUND_KEY_SOUNDDETECTOR exists. The searches are split
    # between the bots that have a key (each key keeps its own 60/minute limit; downloads are not limited).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        bot: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key
        id: key
        env:
          K1: ${{ secrets.FREESOUND_KEY_SOUNDMAN }}
          K2: ${{ secrets.FREESOUND_KEY_SOUNDDETECTOR }}
        run: |
          test -n "$K1" || { echo "Add the repository secret FREESOUND_KEY_SOUNDMAN first"; exit 1; }
          bots=1; [ -n "$K2" ] && [ "${{ inputs.bots }}" = "2" ] && bots=2
          echo "bots=$bots" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.bot }}" -gt "$bots" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          key="$K1"; [ "${{ matrix.bot }}" = 2 ] && key="$K2"
          mkdir -p ~/.secret-song && umask 077 && printf '%s' "$key" > ~/.secret-song/freesound.key
      - name: Pull this bot's share of the searches
        if: steps.key.outputs.skip != '1'
        run: |
          grep -v '^#' "${{ inputs.queries }}" | sed '/^\s*$/d' | awk -v n="${{ steps.key.outputs.bots }}" -v b="${{ matrix.bot }}" '(NR-1)%n==b-1' > my_queries.txt
          echo "bot ${{ matrix.bot }} of ${{ steps.key.outputs.bots }}: $(wc -l < my_queries.txt) searches"
          python pull_queries.py "data/${{ inputs.name }}" my_queries.txt --per-query "${{ inputs.per_query }}" --max-seconds "${{ inputs.max_seconds }}"
      - name: Upload this bot's clips
        if: steps.key.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ inputs.name }}-bot${{ matrix.bot }}
          path: data/${{ inputs.name }}
          retention-days: 30

  score:
    needs: pull
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy librosa soundfile
      - name: Collect every bot's clips
        uses: actions/download-artifact@v4
        with:
          pattern: clips-${{ inputs.name }}-bot*
          path: parts
      - name: Merge
        run: |
          mkdir -p "data/${{ inputs.name }}"
          python - <<'PY'
          import json, shutil, pathlib
          out = pathlib.Path("data/${{ inputs.name }}"); meta = {}
          for part in sorted(pathlib.Path("parts").iterdir()):
              m = part / "meta.json"
              if m.exists():
                  meta.update(json.loads(m.read_text(encoding="utf-8")))
              for f in part.glob("*.mp3"):
                  shutil.copy(f, out / f.name)
          (out / "meta.json").write_text(json.dumps(meta), encoding="utf-8")
          print(len(meta), "clips from", len(list(pathlib.Path("parts").iterdir())), "bot(s)")
          PY
      - name: Score and A/B
        run: |
          out="results/${{ inputs.name }}"
          mkdir -p "$out"
          python steel_score.py "data/${{ inputs.name }}" --meta "data/${{ inputs.name }}/meta.json" --jobs 4 \
            --csv "$out/scores.csv" --top 40 --ab "${{ inputs.ab }}" --clue "${{ inputs.ab_clue }}" --out "$out/ab" \
            | tee "$out/scores.txt"
          cp "data/${{ inputs.name }}/meta.json" "$out/meta.json"
          echo "scored with steel_score.py (Mid North Coast fingerprint); A/B clue: ${{ inputs.ab_clue }}" >> "$out/scores.txt"
      - name: Commit results to the results branch
        run: |
          git config user.name "secret-sound bot"
          git config user.email "actions@users.noreply.github.com"
          mv "results/${{ inputs.name }}" /tmp/res
          git fetch origin results || true
          if git rev-parse --verify -q origin/results >/dev/null; then git checkout -B results origin/results; else git checkout --orphan results && git rm -rq --cached . && git clean -fdq; fi
          mkdir -p results && rm -rf "results/${{ inputs.name }}" && mv /tmp/res "results/${{ inputs.name }}"
          git add -f "results/${{ inputs.name }}"
          git commit -qm "results: ${{ inputs.name }}" && git push -q origin results
